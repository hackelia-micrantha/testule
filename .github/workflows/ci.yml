name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: runner-testule
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify pinned toolchain
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake metadata --no-write-lock-file
          nix --extra-experimental-features 'nix-command flakes' develop --no-write-lock-file --command bash -lc '
            set -euo pipefail
            go version
            staticcheck -version
            python --version
          '

      - name: Validate
        run: nix --extra-experimental-features 'nix-command flakes' develop --no-write-lock-file --command bash scripts/ci.sh
